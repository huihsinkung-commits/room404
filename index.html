*{box-sizing:border-box}body{margin:0;background:#101518;color:#e9e5d9;font-family:system-ui,'Noto Sans TC',sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#f0e4c4;font-size:24px;text-shadow:0 0 9px #000}#hint{position:absolute;top:58%;width:100%;text-align:center;font-size:14px;color:#f3d9a0;text-shadow:0 2px 4px #000}#top{position:absolute;top:14px;left:16px;font-size:13px;letter-spacing:.04em;color:#e7dcc7;max-width:58%;text-shadow:0 2px 6px #000;background:#10181dbb;border-radius:8px;padding:7px 9px}#goal{display:inline-block;margin-top:5px;color:#f1d49e;line-height:1.45}#toolbar{position:absolute;right:15px;top:14px;display:flex;gap:8px;pointer-events:auto}.btn{background:#192329e8;color:#eee1cc;border:1px solid #8c7d69;border-radius:8px;padding:9px 13px}.btn:hover{background:#344149}#toast{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);background:#12191fe8;padding:10px 17px;border-radius:8px;max-width:85%;text-align:center;opacity:0;transition:opacity .3s}#modal{position:fixed;inset:0;background:#080b0dd9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}#panel{width:min(650px,100%);max-height:90vh;overflow:auto;background:#1b2529;border:1px solid #796b59;border-radius:12px;padding:24px;box-shadow:0 20px 70px #0009}h1{font-size:32px;letter-spacing:.1em;margin:0 0 12px}h2{font-size:21px;margin:0 0 16px}p{line-height:1.85;color:#cfc9bd}.sub{color:#c6a77d;font-size:13px;letter-spacing:.15em}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.clue{border:1px solid #475459;border-radius:8px;padding:11px;margin:9px 0;background:#12191d}#mobile{position:absolute;inset:0;pointer-events:none;display:none}#stick{position:absolute;bottom:24px;left:24px;width:112px;height:112px;border-radius:50%;background:#d9d3c01c;border:1px solid #ddd8c080;pointer-events:auto;touch-action:none}#nub{position:absolute;width:44px;height:44px;border-radius:50%;background:#ddd8c070;left:33px;top:33px}#use{position:absolute;bottom:50px;right:25px;width:76px;height:76px;border-radius:50%;background:#c4a47766;border:1px solid #e2ca9b;color:white;pointer-events:auto;touch-action:manipulation}#look{position:absolute;right:0;top:20%;width:54%;height:58%;pointer-events:auto;touch-action:none}#flash{position:absolute;bottom:138px;right:35px;pointer-events:auto}#footer{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#c2b49a;text-align:center;white-space:nowrap}@media(pointer:coarse){#top{max-width:52%;font-size:10px}#mobile{display:block}#footer{display:none}#toolbar .btn{padding:8px;font-size:12px}#top{font-size:11px;max-width:40%}}@media(max-width:550px){h1{font-size:25px}#panel{padding:17px}}

/* V10 physical inspection overlays */
#panel:has(.photo-workbench),#panel:has(.diary-book){width:min(880px,100%);background:#171a1b}
.photo-workbench{display:grid;gap:12px}.photo-instruction{font-size:13px;color:#d2c6ac}.photo-stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#302a24;padding:10px;border:2px solid #62503c;border-radius:9px;min-height:190px}.photo-slot{position:relative;aspect-ratio: .74;min-width:0;border:2px dashed #8a7860;border-radius:4px;background:#24211d;display:grid;place-items:center;overflow:hidden;touch-action:none}.photo-slot.selected{border-color:#e8c88e}.photo-slot img{width:100%;height:100%;object-fit:cover;pointer-events:none}.photo-slot .slot-number{position:absolute;top:4px;left:6px;background:#1a1a1acc;color:#fff;padding:2px 6px;font-size:11px}.photo-tray{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;background:#29231e;border-radius:8px}.photo-piece{width:clamp(72px,19vw,132px);height:clamp(104px,27vw,172px);padding:4px;background:#d6c3a0;border:2px solid #796448;border-radius:3px;cursor:grab;touch-action:none;user-select:none;position:relative}.photo-piece:active{cursor:grabbing}.photo-piece img{width:100%;height:100%;object-fit:cover;pointer-events:none}.photo-piece span{position:absolute;bottom:5px;right:5px;background:#191a19dc;color:#f4dfbd;font-size:11px;padding:2px 5px}.photo-piece.dragging{opacity:.45}.photo-dragghost{position:fixed;z-index:100;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);box-shadow:0 8px 28px #000b}.photo-piece:focus-visible,.photo-slot:focus-visible{outline:3px solid #e7c07d}.photo-actions{display:flex;gap:8px;flex-wrap:wrap}.photo-note{font-size:12px;color:#d7c9b3}.diary-book{position:relative;max-width:570px;margin:10px auto 18px;min-height:285px;perspective:1200px}.diary-cover{background:linear-gradient(110deg,#4b3527,#75503a 12%,#463024 90%);border:7px solid #3a291f;border-radius:7px 14px 14px 7px;box-shadow:8px 12px 22px #0009;padding:15px}.diary-page{position:relative;min-height:260px;background:repeating-linear-gradient(#e1d4b5 0px,#e1d4b5 26px,#a9a089 27px);border-radius:2px 9px 9px 2px;color:#443b32;padding:28px 25px 20px 34px;box-shadow:inset 13px 0 20px #66563b40;transform-origin:left center;animation:pageTurn .45s ease-out}.diary-page h3{margin:0 0 18px;font-size:17px;color:#514333}.diary-page p{color:#423a31;font-size:16px;line-height:1.8;white-space:pre-line}.diary-page .page-num{position:absolute;bottom:12px;right:22px;font-size:12px;color:#726752}@keyframes pageTurn{from{transform:rotateY(-70deg);opacity:.5}to{transform:rotateY(0);opacity:1}}.diary-controls{display:flex;gap:8px;justify-content:space-between;align-items:center}.diary-controls button:disabled{opacity:.4;cursor:default}@media(max-width:550px){.photo-stage{min-height:130px;padding:5px;gap:3px}.photo-slot .slot-number{font-size:9px}.diary-page{min-height:235px;padding:18px 13px 25px 24px}.diary-page p{font-size:14px}}

/* V12: physical photographic fragments, no cartoon frames */
.photo-piece{background:#b6a183;border:1px solid #6a5946;padding:3px;box-shadow:2px 5px 11px #0009;transform:rotate(-1.4deg);filter:sepia(.14) contrast(.93)}
.photo-piece:nth-child(2){transform:rotate(2.1deg)}.photo-piece:nth-child(3){transform:rotate(-2.4deg)}
.photo-piece img{clip-path:polygon(0 0,97% 1%,100% 12%,98% 26%,100% 40%,97% 58%,100% 78%,97% 100%,0 99%,2% 85%,0 65%,2% 47%,0 23%);filter:grayscale(.17) sepia(.13)}
.photo-slot img{filter:grayscale(.17) sepia(.13)}.photo-stage{background:repeating-linear-gradient(25deg,#2c241e,#302821 7px,#2a241e 13px);box-shadow:inset 0 5px 15px #0008}

/* V17 surveillance footage: actual rendered images, responsive on phones. */
.cctv-shell{background:#030908;border:9px solid #080e10;border-radius:8px;box-shadow:inset 0 0 18px #000,0 12px 32px #0008;overflow:hidden}.cctv-shell canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:auto}.cctv-description{margin:10px 0;color:#c7cdbf;font-size:14px}.cctv-active{border-color:#d3bd8a!important;background:#39443c!important;color:#fff!important}#panel:has(.cctv-shell){width:min(800px,100%)}
.cctv-shell.cctv-zoom{overflow:auto;max-height:52vh;touch-action:pan-x pan-y}
.cctv-shell.cctv-zoom canvas{width:160%;max-width:none}

.record-paper{background:linear-gradient(125deg,#d2c5a5,#b5a582);color:#29251d;padding:18px 17px;border-radius:3px;border-left:8px solid #77664b;line-height:1.85;box-shadow:inset 0 0 28px #77664b44;margin:12px 0;white-space:pre-line}
.audio-visual{border:1px solid #6c7d74;background:#111c1c;color:#a4c7ae;overflow:hidden;text-align:center;padding:22px 4px;letter-spacing:2px;font-size:20px}

/* V23: Character portraits and spoken testimony, optimized for mobile. */
.witness-stage{display:grid;grid-template-columns:minmax(110px,39%) 1fr;gap:14px;align-items:stretch;margin:12px 0}
.witness-portrait{position:relative;overflow:hidden;min-height:245px;border:1px solid #716b5d;border-radius:9px;background:linear-gradient(135deg,#3a443e,#131a19)}
.witness-portrait svg{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.witness-portrait:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px 5px);opacity:.35}
.witness-label{position:absolute;bottom:8px;left:8px;right:8px;background:#111b1bcc;color:#e5d7bd;padding:5px;font-size:12px;border-radius:4px}
.witness-speech{background:#bfb49b;color:#27251f;border-radius:9px;padding:16px 13px;min-height:170px;display:flex;flex-direction:column;justify-content:center;line-height:1.9;font-size:clamp(15px,3.6vw,19px);box-shadow:inset 0 0 22px #6d5c4630}
.witness-speech small{color:#665a47;font-size:12px;display:block;margin-bottom:10px;letter-spacing:1px}
.witness-mouth{transform-origin:50% 50%;animation:witnessTalk .35s ease-in-out infinite alternate}
@keyframes witnessTalk{0%{transform:scaleY(.45)}100%{transform:scaleY(1.15)}}
.witness-portrait.paused .witness-mouth{animation-play-state:paused}
@media(max-width:440px){.witness-stage{grid-template-columns:38% 1fr;gap:9px}.witness-portrait{min-height:230px}.witness-speech{padding:11px 9px}}

/* V27 cinematic photo dialogue. Photos are supplied by the user. */
.witness-stage{grid-template-columns:1fr;gap:9px}
.witness-portrait.cinematic-photo{min-height:0;height:clamp(180px,31vh,310px);border-radius:10px;background:#080b0d}
.witness-portrait.cinematic-photo img{width:100%;height:100%;object-fit:cover;object-position:center 36%;filter:brightness(.85) contrast(1.08) saturate(.85);animation:cinematicBreath 6s ease-in-out infinite alternate}
.witness-portrait.cinematic-photo:before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 50px 18px #060708a8;pointer-events:none}
.witness-portrait.cinematic-photo .witness-label{z-index:2;font-size:13px}
.witness-speech{min-height:100px;padding:12px 14px}
@keyframes cinematicBreath{from{transform:scale(1)}to{transform:scale(1.035)}}
@media(max-width:440px){.witness-stage{grid-template-columns:1fr}.witness-portrait.cinematic-photo{height:clamp(170px,29vh,270px)}}

/* V39: ending is a terminal, persistent state, not an exploration modal. */
body.game-ended #hud,body.game-ended #hint,body.game-ended #joystick,body.game-ended #touchControls{visibility:hidden!important;pointer-events:none!important}
body.game-ended #modal{display:flex!important;background:rgba(3,5,8,.97)!important}
body.game-ended #panel{max-width:680px!important;max-height:92dvh!important;overflow-y:auto!important;border:1px solid #806e55!important;background:linear-gradient(145deg,#161c20,#090d12)!important;box-shadow:0 0 70px #000!important}
.ending-stamp{letter-spacing:.28em;text-align:center;color:#c4a782;font-size:12px;margin:12px 0 20px}
.ending-body{font-size:clamp(17px,4vw,21px);line-height:2.05;white-space:normal;color:#eee4d5;margin:24px 0}
.ending-credits{border-top:1px solid #716550;padding-top:20px;margin-top:24px;text-align:center;color:#b9ac98;font-size:13px;line-height:1.9}

/* V42: cinematic witness dialogue with evidence-linked questioning. */
.witness-stage{position:relative;overflow:hidden;border-radius:12px}
.witness-stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 52%,rgba(2,4,9,.7));z-index:1}
.witness-stage .witness-portrait{transition:transform .7s ease;transform:scale(1.02);transform-origin:50% 34%}
.witness-stage.talking .witness-portrait{animation:witnessBreath 3.8s ease-in-out infinite}
@keyframes witnessBreath{0%,100%{transform:scale(1.02) translateY(0)}50%{transform:scale(1.035) translateY(2px)}}
.witness-evidence{border-left:3px solid #9d8669;padding:10px 12px;margin:12px 0;background:rgba(151,121,79,.10);line-height:1.7}
.witness-cut{letter-spacing:.14em;color:#c3ac88;font-size:12px}
@media(prefers-reduced-motion:reduce){.witness-stage.talking .witness-portrait{animation:none}}

@media (max-width:600px){.actions .btn{min-height:44px;touch-action:manipulation}#panel{max-height:92dvh;overflow-y:auto}}
@media(prefers-reduced-motion:reduce){.witness-portrait{animation:none!important}}

// V38: Real Three.js skeletal hierarchy with SkinnedMesh and per-vertex skin weights.
// The lightweight existing GLB mesh is rebound to an articulated skeleton, not a sprite.
function rigWalkCharacter(model){
 model.updateMatrixWorld(true);
 const bones=[];
 function bone(name,parent,x,y,z){const b=new THREE.Bone();b.name=name;b.position.set(x,y,z);parent.add(b);bones.push(b);return b}
 const root=bone('Root',model,0,0,0);
 const hip=bone('Pelvis',root,0,.92,0);
 const chest=bone('Spine',hip,0,.36,0);
 const neck=bone('Neck',chest,0,.27,0);
 const head=bone('Head',neck,0,.02,0);
 const leftArm=bone('LeftUpperArm',chest,-.29,.12,0);
 const rightArm=bone('RightUpperArm',chest,.29,.12,0);
 const leftLeg=bone('LeftUpperLeg',hip,-.145,-.06,0);
 const rightLeg=bone('RightUpperLeg',hip,.145,-.06,0);
 const leftFoot=bone('LeftFoot',leftLeg,0,-.77,.025);
 const rightFoot=bone('RightFoot',rightLeg,0,-.77,.025);
 model.updateMatrixWorld(true);
 const original=[];model.traverse(o=>{if(o.isMesh&&!o.isSkinnedMesh)original.push(o)});
 const inverseModel=model.matrixWorld.clone().invert();
 for(const part of original){
  const name=part.name.toLowerCase();let idx=1;
  if(/^(leg|pant)/.test(name))idx=name.includes('-1')?7:8;
  else if(/^(shoe|sole|foot)/.test(name))idx=name.includes('-1')?9:10;
  else if(/^(arm|hand|cuff)/.test(name))idx=name.includes('-1')?5:6;
  else if(/^(face|eye|pupil|brow|ear|nose|mouth|chin|hair|fringe|sidehair|strand|wrinkle)/.test(name))idx=4;
  else if(/^(neck)/.test(name))idx=3;
  else if(/^(jacket|shirt|lapel|torso|chest|shoulder|collar|hood|pocket|button|zipper)/.test(name))idx=2;
  const geo=part.geometry.clone();
  const transform=inverseModel.clone().multiply(part.matrixWorld);
  geo.applyMatrix4(transform);
  const count=geo.attributes.position.count;
  const skinIndex=new Uint16Array(count*4),skinWeight=new Float32Array(count*4);
  for(let k=0;k<count;k++){skinIndex[k*4]=idx;skinWeight[k*4]=1}
  geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(skinIndex,4));
  geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(skinWeight,4));
  const skin=new THREE.SkinnedMesh(geo,part.material);skin.name=part.name;skin.frustumCulled=false;
  model.add(skin);model.updateMatrixWorld(true);
  const skeleton=new THREE.Skeleton(bones);
  skin.bind(skeleton,new THREE.Matrix4());
  part.parent.remove(part);
 }
 return {hip,chest,head,leftArm,rightArm,leftLeg,rightLeg,leftFoot,rightFoot};
}
// V43: optional, low-overhead procedural atmosphere. Starts only on user gesture.
let ambienceContext=null,ambienceMaster=null,ambienceTimer=0;
function audioEnabled(){return state?.settings?.sound!==false}
function initAmbience(){
 if(!audioEnabled()||ambienceContext)return;

function paintPhotograph(){
 // A real photographic source replaces the earlier flat cartoon drawing.
 const source=new Image();source.onload=()=>{
  pg.drawImage(source,0,0,900,540);
  // Film fade, stains and slight optical falloff make this a handled old print.
  const fade=pg.createLinearGradient(0,0,900,540);fade.addColorStop(0,'rgba(197,167,112,.12)');fade.addColorStop(.55,'rgba(35,28,20,.03)');fade.addColorStop(1,'rgba(80,50,27,.19)');pg.fillStyle=fade;pg.fillRect(0,0,900,540);
  for(let i=0;i<1800;i++){const x=(i*173+47)%900,y=(i*319+31)%540;pg.fillStyle=i%3===0?'rgba(28,20,13,.07)':'rgba(255,245,210,.09)';pg.fillRect(x,y,1+(i%3),1+(i%2))}
  const vign=pg.createRadialGradient(450,270,100,450,270,620);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(24,14,8,.43)');pg.fillStyle=vign;pg.fillRect(0,0,900,540);
  photoSlices.splice(0,photoSlices.length,...[0,1,2].map(i=>{const c=document.createElement('canvas');c.width=300;c.height=540;const x=c.getContext('2d');x.drawImage(photoCanvas,i*300,0,300,540,0,0,300,540);return c.toDataURL('image/png')}));
 };source.src=PHOTO_SOURCE;
}
const photoSlices=[0,1,2].map(()=>PHOTO_SOURCE);
paintPhotograph();
const photoPieceById={photoB:0,photoC:1,photoA:2};
let pickedPiece=null;
function photoPuzzle(){state.photoOrder??=[];
 const slots=Array.from({length:3},(_,i)=>{const id=state.photoOrder[i];return `<div class="photo-slot" tabindex="0" role="button" data-slot="${i}" aria-label="照片位置${i+1}${id?'，已有碎片':''}">${id?`<img src="${photoSlices[photoPieceById[id]]}" alt="已放入的照片部分">`:''}<span class="slot-number">${i+1}</span></div>`}).join('');
 const remaining=['photoA','photoB','photoC'].filter(x=>!state.photoOrder.includes(x));
